<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>kora — workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body.theme-cozy {
            --bg-color: #f7f3f2;
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-main: #4a3b3c;
            --text-muted: #8c7678;
            --accent-soft: #e8d3d5;
            --accent-dark: #b89799;
            --border-color: rgba(232, 211, 213, 0.5);
            --shadow: 0 4px 20px 0 rgba(184, 151, 153, 0.06);
            --pattern-bg: radial-gradient(#e8d3d5 0.75px, transparent 0.75px);
            --font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body.theme-focus {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-soft: #334155;
            --accent-dark: #38bdf8;
            --border-color: rgba(51, 65, 85, 0.8);
            --shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.2);
            --pattern-bg: radial-gradient(#334155 0.75px, transparent 0.75px);
            --font-family: 'Inter', sans-serif;
        }

        body.theme-classic {
            --bg-color: #fcfbf9;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #2c2c2c;
            --text-muted: #767676;
            --accent-soft: #eae5df;
            --accent-dark: #5c554e;
            --border-color: rgba(220, 215, 208, 0.8);
            --shadow: 0 4px 15px 0 rgba(0, 0, 0, 0.03);
            --pattern-bg: none;
            --font-family: 'Lora', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            text-transform: lowercase;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--pattern-bg);
            background-size: 24px 24px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }

        /* Tela de Entrada */
        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            background-image: var(--pattern-bg);
            background-size: 24px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            z-index: 9999;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            padding: 20px;
            text-align: center;
        }

        .welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .welcome-title {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .welcome-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .welcome-btn {
            background-color: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 12px 28px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        /* Container Principal Vertical */
        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 40px;
        }

        /* Topo Clean com Seletor Nativo */
        .sidebar {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .app-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        /* Seletor Nativo de Estética (Estilo iPhone) */
        .theme-selector {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px 10px;
            font-size: 0.8rem;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
            -webkit-overflow-scrolling: touch;
        }

        .nav-tabs::-webkit-scrollbar {
            display: none;
        }

        .nav-tab {
            background: none;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.2s;
            white-space: nowrap;
        }

        .nav-tab:hover {
            background-color: var(--accent-soft);
            color: var(--text-main);
        }

        .nav-tab.active {
            background-color: var(--accent-soft);
            color: var(--text-main);
            font-weight: 600;
        }

        .datetime-widget {
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .datetime-widget .time {
            font-weight: 600;
            color: var(--text-main);
        }

        /* Conteúdo Principal */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .tab-content.active {
            display: flex;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .card h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            font-size: 0.88rem;
            background-color: var(--card-bg);
            color: var(--text-main);
            text-transform: lowercase;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-dark);
        }

        textarea {
            resize: none;
            flex: 1;
            min-height: 250px;
            line-height: 1.5;
        }

        button.action-btn {
            background-color: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 0 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            height: 42px;
            white-space: nowrap;
            text-transform: lowercase;
        }

        /* Central de Tarefas */
        .task-creator-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 14px;
        }

        .task-input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        @media (min-width: 450px) {
            .task-input-wrapper {
                flex-direction: row;
            }
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 2px;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 14px;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        li.completed span {
            text-decoration: line-through;
            color: var(--text-muted);
            opacity: 0.6;
        }

        .item-content {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex: 1;
            word-break: break-word;
            font-size: 0.88rem;
        }

        input[type="checkbox"] {
            accent-color: var(--text-main);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 6px;
        }

        .badge {
            font-size: 0.65rem;
            padding: 3px 6px;
            border-radius: 6px;
            font-weight: 500;
            margin-right: 4px;
            color: #fff;
            white-space: nowrap;
        }

        .project-filters {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .project-filters::-webkit-scrollbar {
            display: none;
        }

        .project-chip {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text-muted);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .project-chip.active {
            background: var(--text-main);
            color: var(--bg-color);
            border-color: var(--text-main);
            font-weight: 600;
        }

        /* Pomodoro */
        .pomodoro-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            text-align: center;
            padding: 10px 0;
        }

        .timer-display {
            font-size: 3.2rem;
            font-weight: 300;
            letter-spacing: -2px;
            color: var(--text-main);
        }

        .timer-controls {
            display: flex;
            gap: 10px;
        }

        .timer-settings {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .timer-settings input {
            width: 55px;
            text-align: center;
        }
    </style>
</head>
<body class="theme-cozy">

    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-title">kora</div>
        <div class="welcome-subtitle">seu espaço particular de produtividade</div>
        <button class="welcome-btn" onclick="enterApp()">entrar</button>
    </div>

    <div class="app-container">
        <!-- Topo Clean com Seletor Nativo de Estética -->
        <header class="sidebar">
            <div class="sidebar-header">
                <div class="app-title">kora</div>
                <select id="themeSelect" class="theme-selector" onchange="changeTheme(this.value)">
                    <option value="cozy">cozy & soft</option>
                    <option value="focus">focus & flow</option>
                    <option value="classic">classic clean</option>
                </select>
            </div>

            <nav class="nav-tabs" id="navTabsContainer">
                <button class="nav-tab active" onclick="switchTab('tasks', event)" data-tab="tasks">tarefas</button>
                <button class="nav-tab" onclick="switchTab('reading', event)" data-tab="reading">leitura</button>
                <button class="nav-tab" onclick="switchTab('notes', event)" data-tab="notes">notas</button>
                <button class="nav-tab" onclick="switchTab('focus', event)" data-tab="focus">foco</button>
                <button class="nav-tab" onclick="switchTab('links', event)" data-tab="links">links</button>
            </nav>

            <div class="datetime-widget">
                <span id="dateDisplay">carregando...</span>
                <span class="time" id="clockDisplay">00:00:00</span>
            </div>
        </header>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <!-- TAREFAS -->
            <div id="tasks" class="tab-content active" data-tab="tasks">
                <div class="card">
                    <h3>central de tarefas</h3>
                    
                    <div class="task-creator-box">
                        <input type="text" id="newProjectName" placeholder="nome da nova pasta...">
                        <div style="display: flex; gap: 8px;">
                            <select id="newProjectColor" style="flex: 1;">
                                <option value="#d4a373">bege</option>
                                <option value="#b89799" selected>rosa</option>
                                <option value="#9381ff">lavanda</option>
                                <option value="#606c38">verde</option>
                            </select>
                            <button class="action-btn" onclick="addProject()">criar pasta</button>
                        </div>
                    </div>

                    <div class="project-filters" id="projectFilters">
                        <div class="project-chip active" onclick="filterProject('all')">todas</div>
                    </div>

                    <div class="task-input-wrapper">
                        <select id="taskProjectSelect" style="flex: 1;"></select>
                        <div style="display: flex; gap: 8px; flex: 2;">
                            <input type="text" id="taskInput" placeholder="o que precisa ser feito..." style="flex: 1;">
                            <button class="action-btn" onclick="addTask()">adicionar</button>
                        </div>
                    </div>

                    <ul id="taskList"></ul>
                </div>
            </div>

            <!-- LEITURA -->
            <div id="reading" class="tab-content" data-tab="reading">
                <div class="card">
                    <h3>reading tracker</h3>
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <input type="text" id="bookTitle" placeholder="título do livro atual...">
                        <div style="display: flex; gap: 8px;">
                            <input type="number" id="bookCurrent" placeholder="pág. atual" style="flex: 1;">
                            <input type="number" id="bookTotal" placeholder="total" style="flex: 1;">
                            <button class="action-btn" onclick="saveBook()">salvar</button>
                        </div>
                    </div>
                    <div id="bookProgressDisplay" style="margin-top: 4px; font-size: 0.85rem; color: var(--text-muted); background: rgba(255,255,255,0.4); border: 1px solid var(--border-color); padding: 14px; border-radius: 12px;">
                        nenhuma leitura cadastrada.
                    </div>
                </div>
            </div>

            <!-- NOTAS -->
            <div id="notes" class="tab-content" data-tab="notes">
                <div class="card">
                    <h3>notas & brain dump</h3>
                    <textarea id="notesArea" placeholder="escreva seus pensamentos..."></textarea>
                </div>
            </div>

            <!-- FOCO -->
            <div id="focus" class="tab-content" data-tab="focus">
                <div class="card">
                    <h3>pomodoro</h3>
                    <div class="pomodoro-container">
                        <div class="timer-display" id="timerDisplay">25:00</div>
                        <div class="timer-controls">
                            <button class="action-btn" id="startBtn" onclick="togglePomodoro()">iniciar</button>
                            <button class="action-btn" onclick="resetPomodoro()" style="background-color: var(--accent-dark);">zerar</button>
                        </div>
                        <div class="timer-settings">
                            min: <input type="number" id="workTime" value="25" min="1" max="60" onchange="updateTimerSetting()">
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3>soundtrack</h3>
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <p style="font-size: 0.8rem; color: var(--text-muted);">link embed spotify/youtube:</p>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="playlistInput" placeholder="https://..." style="flex: 1;">
                            <button class="action-btn" onclick="savePlaylist()">ok</button>
                        </div>
                        <div class="player-embed" id="playerContainer">
                            <p style="font-size: 0.8rem; color: var(--text-muted); text-align: center; padding: 10px;">sem playlist</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- LINKS -->
            <div id="links" class="tab-content" data-tab="links">
                <div class="card">
                    <h3>links úteis</h3>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <input type="text" id="linkTitleInput" placeholder="nome do site...">
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="linkUrlInput" placeholder="url (https://...)" style="flex: 1;">
                            <button class="action-btn" onclick="addBookmark()">adicionar</button>
                        </div>
                    </div>
                    <div id="bookmarksContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 6px;"></div>
                </div>
            </div>
        </main>
    </div>

    <audio id="alarmAudio" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        function enterApp() {
            document.getElementById('welcomeScreen').classList.add('hidden');
            localStorage.setItem('kora_entered', 'true');
        }

        if (localStorage.getItem('kora_entered') === 'true') {
            document.getElementById('welcomeScreen').classList.add('hidden');
        }

        function updateDateTime() {
            const now = new Date();
            document.getElementById('clockDisplay').textContent = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('pt-BR', options);
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        function changeTheme(themeName) {
            document.body.className = `theme-${themeName}`;
            localStorage.setItem('kora_theme', themeName);
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('kora_theme') || 'cozy';
            document.body.className = `theme-${savedTheme}`;
            const select = document.getElementById('themeSelect');
            if (select) select.value = savedTheme;
        }
        loadTheme();

        function switchTab(tabId, event) {
            if (event) event.preventDefault();
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            
            const targetContent = document.getElementById(tabId);
            const targetTab = document.querySelector(`.nav-tab[data-tab="${tabId}"]`);
            
            if (targetContent) targetContent.classList.add('active');
            if (targetTab) targetTab.classList.add('active');
        }

        let currentFilter = 'all';

        function getProjects() {
            return JSON.parse(localStorage.getItem('kora_projects')) || [
                { id: 'p1', name: 'faculdade', color: '#b89799' },
                { id: 'p2', name: 'monografia', color: '#9381ff' },
                { id: 'p3', name: 'vida pessoal', color: '#d4a373' }
            ];
        }

        function renderProjects() {
            const projects = getProjects();
            const filtersContainer = document.getElementById('projectFilters');
            const select = document.getElementById('taskProjectSelect');
            
            filtersContainer.innerHTML = `<div class="project-chip ${currentFilter === 'all' ? 'active' : ''}" onclick="filterProject('all')">todas</div>`;
            select.innerHTML = '';

            projects.forEach(p => {
                filtersContainer.innerHTML += `
                    <div class="project-chip ${currentFilter === p.id ? 'active' : ''}" onclick="filterProject('${p.id}')">
                        <span style="width: 8px; height: 8px; border-radius: 50%; background: ${p.color}; display: inline-block;"></span>
                        ${p.name}
                        <span class="del-chip" onclick="event.stopPropagation(); removeProject('${p.id}')" title="apagar">×</span>
                    </div>`;
                select.innerHTML += `<option value="${p.id}">${p.name}</option>`;
            });
            renderTasks();
        }

        function addProject() {
            const name = document.getElementById('newProjectName').value.trim().toLowerCase();
            const color = document.getElementById('newProjectColor').value;
            if (!name) return;
            const projects = getProjects();
            projects.push({ id: 'p_' + Date.now(), name, color });
            localStorage.setItem('kora_projects', JSON.stringify(projects));
            document.getElementById('newProjectName').value = '';
            renderProjects();
        }

        function removeProject(id) {
            if (!confirm('deseja apagar esta pasta?')) return;
            let projects = getProjects();
            projects = projects.filter(p => p.id !== id);
            localStorage.setItem('kora_projects', JSON.stringify(projects));
            
            let tasks = getTasks();
            tasks = tasks.filter(t => t.projectId !== id);
            localStorage.setItem('kora_tasks', JSON.stringify(tasks));

            if (currentFilter === id) currentFilter = 'all';
            renderProjects();
        }

        function filterProject(id) {
            currentFilter = id;
            renderProjects();
        }

        function getTasks() {
            return JSON.parse(localStorage.getItem('kora_tasks')) || [];
        }

        function renderTasks() {
            const tasks = getTasks();
            const projects = getProjects();
            const list = document.getElementById('taskList');
            list.innerHTML = '';

            const filtered = currentFilter === 'all' ? tasks : tasks.filter(t => t.projectId === currentFilter);

            filtered.forEach((item, index) => {
                const project = projects.find(p => p.id === item.projectId) || { name: 'geral', color: '#b89799' };
                const originalIndex = tasks.indexOf(item);
                const li = document.createElement('li');
                if (item.completed) li.classList.add('completed');
                li.innerHTML = `
                    <div class="item-content" onclick="toggleTask(${originalIndex})">
                        <input type="checkbox" ${item.completed ? 'checked' : ''}>
                        <span class="badge" style="background-color: ${project.color}">${project.name}</span>
                        <span>${item.text}</span>
                    </div>
                    <button class="delete-btn" onclick="removeTask(${originalIndex})">×</button>
                `;
                list.appendChild(li);
            });
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const select = document.getElementById('taskProjectSelect');
            const text = input.value.trim().toLowerCase();
            if (!text) return;
            const tasks = getTasks();
            tasks.push({ text, completed: false, projectId: select.value });
            localStorage.setItem('kora_tasks', JSON.stringify(tasks));
            input.value = '';
            renderTasks();
        }

        function toggleTask(index) {
            const tasks = getTasks();
            tasks[index].completed = !tasks[index].completed;
            localStorage.setItem('kora_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function removeTask(index) {
            const tasks = getTasks();
            tasks.splice(index, 1);
            localStorage.setItem('kora_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        renderProjects();

        function saveBook() {
            const title = document.getElementById('bookTitle').value.trim().toLowerCase();
            const current = parseInt(document.getElementById('bookCurrent').value) || 0;
            const total = parseInt(document.getElementById('bookTotal').value) || 100;
            if (!title) return;
            const book = { title, current, total };
            localStorage.setItem('kora_book', JSON.stringify(book));
            renderBook();
        }

        function renderBook() {
            const book = JSON.parse(localStorage.getItem('kora_book'));
            const display = document.getElementById('bookProgressDisplay');
            if (!book) return;
            const percent = Math.min(100, Math.round((book.current / book.total) * 100));
            document.getElementById('bookTitle').value = book.title;
            document.getElementById('bookCurrent').value = book.current;
            document.getElementById('bookTotal').value = book.total;

            display.innerHTML = `
                <div style="font-weight: 600; color: var(--text-main); margin-bottom: 4px;">📖 ${book.title}</div>
                <div style="display: flex; justify-content: space-between; font-size: 0.78rem; margin-bottom: 4px;">
                    <span>progresso: ${book.current} / ${book.total} pág.</span>
                    <span>${percent}%</span>
                </div>
                <div style="background: var(--accent-soft); border-radius: 10px; height: 6px; width: 100%; overflow: hidden;">
                    <div style="background: var(--text-main); width: ${percent}%; height: 100%; transition: width 0.3s;"></div>
                </div>
            `;
        }
        renderBook();

        const notesArea = document.getElementById('notesArea');
        notesArea.value = localStorage.getItem('kora_notes') || '';
        notesArea.addEventListener('input', () => {
            localStorage.setItem('kora_notes', notesArea.value);
        });

        let timerInterval = null;
        let totalSeconds = 25 * 60;
        let isRunning = false;

        function updateTimerDisplay() {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            document.getElementById('timerDisplay').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function togglePomodoro() {
            const btn = document.getElementById('startBtn');
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
                btn.textContent = 'iniciar';
            } else {
                isRunning = true;
                btn.textContent = 'pausar';
                timerInterval = setInterval(() => {
                    if (totalSeconds > 0) {
                        totalSeconds--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;
                        btn.textContent = 'iniciar';
                        document.getElementById('alarmAudio').play();
                        alert('ciclo concluído!');
                    }
                }, 1000);
            }
        }

        function resetPomodoro() {
            clearInterval(timerInterval);
            isRunning = false;
            document.getElementById('startBtn').textContent = 'iniciar';
            const workMins = parseInt(document.getElementById('workTime').value) || 25;
            totalSeconds = workMins * 60;
            updateTimerDisplay();
        }

        function updateTimerSetting() {
            if (!isRunning) resetPomodoro();
        }

        function savePlaylist() {
            let url = document.getElementById('playlistInput').value.trim();
            if (!url) return;
            if (url.includes('spotify.com') && !url.includes('/embed/')) {
                url = url.replace('spotify.com/', 'spotify.com/embed/');
            } else if (url.includes('youtube.com/watch?v=')) {
                const videoId = url.split('v=')[1]?.split('&')[0];
                url = `https://www.youtube.com/embed/${videoId}`;
            }
            localStorage.setItem('kora_playlist', url);
            renderPlaylist(url);
        }

        function renderPlaylist(url) {
            document.getElementById('playerContainer').innerHTML = `<iframe src="${url}" width="100%" height="110" frameborder="0" allow="encrypted-media"></iframe>`;
        }

        const savedPlaylist = localStorage.getItem('kora_playlist');
        if (savedPlaylist) {
            document.getElementById('playlistInput').value = savedPlaylist;
            renderPlaylist(savedPlaylist);
        }

        function getBookmarks() {
            return JSON.parse(localStorage.getItem('kora_bookmarks')) || [];
        }

        function renderBookmarks() {
            const bookmarks = getBookmarks();
            const container = document.getElementById('bookmarksContainer');
            container.innerHTML = '';
            bookmarks.forEach((b, index) => {
                container.innerHTML += `
                    <div style="position: relative; background: var(--card-bg); border: 1px solid var(--border-color); padding: 10px; border-radius: 10px; display: flex; flex-direction: column; gap: 4px;">
                        <a href="${b.url}" target="_blank" style="text-decoration: none; color: var(--text-main); display: flex; flex-direction: column; gap: 4px;">
                            <span style="font-weight: 600; font-size: 0.8rem;">${b.title}</span>
                            <span style="font-size: 0.65rem; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${b.url}</span>
                        </a>
                        <button onclick="removeBookmark(${index})" style="position: absolute; top: 6px; right: 6px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.7rem;" title="apagar">×</button>
                    </div>
                `;
            });
        }

        function addBookmark() {
            const title = document.getElementById('linkTitleInput').value.trim().toLowerCase();
            let url = document.getElementById('linkUrlInput').value.trim();
            if (!title || !url) return;
            if (!url.startsWith('http')) url = 'https://' + url;
            const bookmarks = getBookmarks();
            bookmarks.push({ title, url });
            localStorage.setItem('kora_bookmarks', JSON.stringify(bookmarks));
            document.getElementById('linkTitleInput').value = '';
            document.getElementById('linkUrlInput').value = '';
            renderBookmarks();
        }

        function removeBookmark(index) {
            const bookmarks = getBookmarks();
            bookmarks.splice(index, 1);
            localStorage.setItem('kora_bookmarks', JSON.stringify(bookmarks));
            renderBookmarks();
        }
        renderBookmarks();
    </script>
</body>
</html>
